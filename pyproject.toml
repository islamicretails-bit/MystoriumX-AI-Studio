[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MystoriumX-AI-Studio"
version = "1.0.0"
description = "AI-powered cinematic soundtrack generation studio with scene analysis, prompt engineering, and professional audio mastering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "MystoriumX AI Studio Team" }
]

keywords = [
    "AI",
    "Music Generation",
    "Audio",
    "Soundtrack",
    "Movie",
    "Documentary",
    "Streamlit",
    "PyTorch",
    "Transformers",
    "Computer Vision"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "streamlit==1.35.0",
    "pydantic==2.7.4",
    "PyYAML==6.0.1",
    "typing_extensions==4.12.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "librosa==0.10.2.post1",
    "soundfile==0.12.1",
    "ffmpeg-python==0.2.0",
    "opencv-python-headless==4.9.0.80",
    "Pillow==10.3.0",
    "torch==2.3.0",
    "transformers==4.41.2",
    "accelerate==0.30.1",
    "safetensors==0.4.3",
    "matplotlib==3.8.4",
    "plotly==5.22.0",
    "tqdm==4.66.4",
    "requests==2.32.3"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.setuptools]
include-package-data = true
